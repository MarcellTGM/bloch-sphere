<!DOCTYPE html>
<html lang="hu" data-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bloch-gömb szimulátor – egyqubites kvantumállapotok és kvantumkapuk interaktív szemléltetése." />
    <title>Bloch-gömb szimulátor · Kvantuminformatikai alkalmazások 2026</title>
    <base href="./" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- A témát még a kirajzolás előtt beállítjuk (villanás elkerülése). -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('bloch-theme');
                if (stored === 'light' || stored === 'dark') {
                    document.documentElement.setAttribute('data-theme', stored);
                }
            } catch (e) { /* privát mód */ }
        })();
    </script>

    <!-- Plotly.js helyben (nincs CDN, így offline is működik) -->
    <script src="js/plotly.min.js"></script>
</head>
<body>
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Segoe UI,sans-serif;color:#8fa2bd;">
            <p>Bloch-gömb szimulátor betöltése…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Váratlan hiba történt. <a href="" class="reload">Újratöltés</a>
    </div>

    <!-- Blazor WebAssembly futtatókörnyezet -->
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/bloch.js"></script>
</body>
</html>
